<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Repair Ticket</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f4f4f8; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 700px; margin: 20px auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #5a67d8; text-align: center; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: bold; }
        input[type="text"], textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 120px; resize: vertical; }
        .button-submit { background-color: #5a67d8; color: #fff; padding: 15px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; transition: background-color 0.3s; }
        .button-submit:hover { background-color: #434190; }
        a { color: #5a67d8; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create New Repair Ticket</h1>
        <form method="post">
            <label for="customer_name">Customer Name:</label>
            <input type="text" id="customer_name" name="customer_name" required>

            <label for="laptop_model">Laptop Model:</label>
            <input type="text" id="laptop_model" name="laptop_model" required>

            <label for="serial_number">Serial Number:</label>
            <input type="text" id="serial_number" name="serial_number" required>

            <label for="issue_description">Issue Description:</label>
            <textarea id="issue_description" name="issue_description" required></textarea>

            <button type="submit" class="button-submit">Create Ticket</button>
        </form>
        <p><a href="{{ url_for('index') }}">Back to Ticket List</a></p>
    </div>
</body>
</html>
