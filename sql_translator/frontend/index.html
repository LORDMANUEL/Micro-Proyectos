<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Language to SQL Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neumorphism-container { background-color: #e0e5ec; }
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-textarea {
            width: 100%;
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
        }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem 2rem;
            font-weight: 600;
            color: #333;
            box-shadow: 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
            cursor: pointer;
        }
        .neumorphism-button:active, .neumorphism-button:disabled {
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
            opacity: 0.7;
        }
        .result-box {
            background-color: #e0e5ec;
            border-radius: 15px;
            padding: 1rem;
            box-shadow: inset 6px 6px 12px #a3b1c6, inset -6px -6px 12px #ffffff;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="neumorphism-container min-h-screen flex items-center justify-center p-4">

    <div class="neumorphism-card w-full max-w-5xl">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Natural Language to SQL Translator</h1>

        <form id="sql-form">
            <label for="natural_query" class="block text-gray-600 mb-2 font-semibold">Ask a question about the data:</label>
            <textarea id="natural_query" rows="3" class="neumorphism-textarea" placeholder="e.g., Show me all invoices for 'Microchips Inc.' with a total greater than 1000" required></textarea>
            <div class="text-center mt-6">
                <button type="submit" id="submit-button" class="neumorphism-button">Translate & Run SQL</button>
            </div>
        </form>

        <!-- Loading Indicator -->
        <div id="loading" class="mt-6 justify-center items-center hidden">
            <div class="loader"></div>
            <p class="ml-4 text-gray-600">Translating and executing, please wait...</p>
        </div>

        <!-- Error Display -->
        <div id="error-box" class="mt-6 hidden">
             <h3 class="font-bold text-lg text-red-600">An Error Occurred</h3>
             <div class="result-box mt-2">
                <p id="error-message" class="text-red-700"></p>
             </div>
        </div>

        <div id="results-container" class="mt-8 hidden">
            <!-- Generated SQL -->
            <div class="mb-6">
                <h3 class="font-bold text-lg text-gray-600">Generated SQL Query</h3>
                <div class="result-box">
                    <pre id="generated-sql" class="text-sm bg-transparent p-2 rounded-lg overflow-x-auto"></pre>
                </div>
            </div>

            <!-- Query Results -->
            <div>
                <h3 class="font-bold text-lg text-gray-600">Query Results</h3>
                <div class="result-box overflow-auto max-h-80">
                    <table id="results-table" class="w-full text-sm text-left">
                        <!-- Content will be generated by JS -->
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('sql-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const naturalQuery = document.getElementById('natural_query').value;
            const resultsContainer = document.getElementById('results-container');
            const loadingDiv = document.getElementById('loading');
            const errorBox = document.getElementById('error-box');
            const errorMessage = document.getElementById('error-message');
            const submitButton = document.getElementById('submit-button');

            // Reset UI
            resultsContainer.classList.add('hidden');
            errorBox.classList.add('hidden');
            loadingDiv.style.display = 'flex';
            submitButton.disabled = true;
            submitButton.textContent = 'Processing...';

            try {
                const response = await fetch('/api/translate_sql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ natural_language_query: naturalQuery })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'An unknown error occurred.');
                }

                // Populate SQL query
                document.getElementById('generated-sql').textContent = data.sql_query;

                // Handle potential SQL errors returned in a 200 response
                if (data.headers.includes("Error")) {
                    const sqlError = data.results[0].Error;
                    throw new Error(`The generated SQL query failed to execute: ${sqlError}`);
                }

                // Populate results table
                const table = document.getElementById('results-table');
                table.innerHTML = '';
                if (data.results && data.results.length > 0) {
                    const thead = table.createTHead();
                    thead.className = 'bg-[#d1d9e6]';
                    const headerRow = thead.insertRow();
                    data.headers.forEach(header => {
                        const th = document.createElement('th');
                        th.className = 'px-4 py-2 font-semibold';
                        th.textContent = header;
                        headerRow.appendChild(th);
                    });

                    const tbody = table.createTBody();
                    data.results.forEach(row => {
                        const tr = tbody.insertRow();
                        tr.className = 'border-t border-gray-300';
                        Object.values(row).forEach(cellValue => {
                            const td = tr.insertCell();
                            td.className = 'px-4 py-2';
                            td.textContent = cellValue;
                        });
                    });
                } else {
                    table.innerHTML = '<thead><tr><th class="px-4 py-2">Result</th></tr></thead><tbody><tr><td class="px-4 py-2">Query executed successfully, but returned no results.</td></tr></tbody>';
                }

                resultsContainer.classList.remove('hidden');

            } catch (error) {
                errorMessage.textContent = error.message;
                errorBox.classList.remove('hidden');
            } finally {
                loadingDiv.style.display = 'none';
                submitButton.disabled = false;
                submitButton.textContent = 'Translate & Run SQL';
            }
        });
    </script>
</body>
</html>
