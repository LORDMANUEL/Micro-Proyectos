<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Language to SQL Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neumorphism-container { background-color: #e0e5ec; }
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-textarea {
            width: 100%;
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-textarea:focus { outline: none; box-shadow: inset 7px 7px 14px #a3b1c6, inset -7px -7px 14px #ffffff; }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem 2rem;
            font-weight: 600;
            color: #333;
            box-shadow: 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .neumorphism-button:hover { box-shadow: 7px 7px 14px #a3b1c6, -7px -7px 14px #ffffff; }
        .neumorphism-button:active { box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff; }
        .result-box {
            background-color: #e0e5ec;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: inset 6px 6px 12px #a3b1c6, inset -6px -6px 12px #ffffff;
        }
    </style>
</head>
<body class="neumorphism-container min-h-screen flex items-center justify-center p-4">

    <div class="neumorphism-card w-full max-w-4xl">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Natural Language to SQL Translator (SAP B1 Schema)</h1>

        <form id="sql-form">
            <label for="natural_query" class="block text-gray-600 mb-2">Ask a question about the data:</label>
            <textarea id="natural_query" rows="3" class="neumorphism-textarea" placeholder="e.g., Show me all invoices for 'Microchips Inc.' with a total greater than 1000" required></textarea>
            <div class="text-center mt-4">
                <button type="submit" id="submit-button" class="neumorphism-button">Translate & Run SQL</button>
            </div>
        </form>

        <div id="results-container" class="mt-8"> <!-- Removed hidden for screenshot -->
            <!-- Generated SQL -->
            <div class="mb-6">
                <h3 class="font-bold text-lg text-gray-600">Generated SQL Query</h3>
                <div class="result-box">
                    <pre id="generated-sql" class="text-sm bg-transparent p-4 rounded-lg overflow-x-auto">SELECT CardName, Country, City FROM OCRD WHERE Country = 'USA';</pre>
                </div>
            </div>

            <!-- Query Results -->
            <div>
                <h3 class="font-bold text-lg text-gray-600">Query Results</h3>
                <div class="result-box overflow-x-auto">
                    <table id="results-table" class="w-full text-sm text-left">
                        <thead>
                            <tr>
                                <th class="px-4 py-2 border-b-2 border-gray-300">CardName</th>
                                <th class="px-4 py-2 border-b-2 border-gray-300">Country</th>
                                <th class="px-4 py-2 border-b-2 border-gray-300">City</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="px-4 py-2 border-b border-gray-300">Microchips Inc.</td>
                                <td class="px-4 py-2 border-b border-gray-300">USA</td>
                                <td class="px-4 py-2 border-b border-gray-300">San Jose</td>
                            </tr>
                            <tr>
                                <td class="px-4 py-2 border-b border-gray-300">Innovate Tech</td>
                                <td class="px-4 py-2 border-b border-gray-300">USA</td>
                                <td class="px-4 py-2 border-b border-gray-300">Austin</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div id="loading" class="mt-4 text-center hidden"><p>Processing...</p></div>
        <div id="error" class="mt-4 text-center text-red-500 hidden"></div>
    </div>

    <script>
        document.getElementById('sql-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const naturalQuery = document.getElementById('natural_query').value;
            const resultsContainer = document.getElementById('results-container');
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const submitButton = document.getElementById('submit-button');

            // Reset UI
            resultsContainer.classList.add('hidden');
            errorDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            submitButton.disabled = true;

            try {
                const response = await fetch('/api/translate_sql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ natural_language_query: naturalQuery })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'An unknown error occurred.');
                }

                const data = await response.json();

                // Populate SQL query
                document.getElementById('generated-sql').textContent = data.sql_query;

                // Populate results table
                const table = document.getElementById('results-table');
                table.innerHTML = ''; // Clear previous results
                if (data.results && data.results.length > 0) {
                    // Create header
                    const thead = table.createTHead();
                    const headerRow = thead.insertRow();
                    data.headers.forEach(header => {
                        const th = document.createElement('th');
                        th.className = 'px-4 py-2 border-b-2 border-gray-300';
                        th.textContent = header;
                        headerRow.appendChild(th);
                    });
                    // Create body
                    const tbody = table.createTBody();
                    data.results.forEach(row => {
                        const tr = tbody.insertRow();
                        Object.values(row).forEach(cellValue => {
                            const td = tr.insertCell();
                            td.className = 'px-4 py-2 border-b border-gray-300';
                            td.textContent = cellValue;
                        });
                    });
                } else {
                    table.innerHTML = '<tr><td class="text-center p-4">No results found.</td></tr>';
                }

                resultsContainer.classList.remove('hidden');

            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.classList.remove('hidden');
            } finally {
                loadingDiv.classList.add('hidden');
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
