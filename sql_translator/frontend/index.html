<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-input {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            box-shadow: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
        }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            color: #333;
            box-shadow: 4px 4px 8px #a3b1c6, -4px -4px 8px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-button:hover {
            box-shadow: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
        }
    </style>
</head>
<body class="bg-[#e0e5ec] min-h-screen p-8">

    <div class="container mx-auto">
        <div class="neumorphism-card mb-8">
            <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Natural Language to SQL</h1>
            <div class="flex items-center space-x-4">
                <input type="text" id="query-input" class="neumorphism-input flex-grow" placeholder="Enter your query in natural language">
                <button id="translate-btn" class="neumorphism-button">Translate</button>
            </div>
        </div>

        <div id="results-card" class="neumorphism-card hidden">
            <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Results</h2>
            <div>
                <h3 class="font-semibold text-lg mb-2">Generated SQL Query</h3>
                <pre id="sql-query" class="bg-gray-200 p-2 rounded whitespace-pre-wrap"></pre>
            </div>
            <div class="mt-4">
                <h3 class="font-semibold text-lg mb-2">Query Results</h3>
                <table class="w-full text-left">
                    <thead id="results-head"></thead>
                    <tbody id="results-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('translate-btn').addEventListener('click', async () => {
            const query = document.getElementById('query-input').value;
            const resultsCard = document.getElementById('results-card');
            const sqlQuery = document.getElementById('sql-query');
            const resultsHead = document.getElementById('results-head');
            const resultsBody = document.getElementById('results-body');

            if (!query) {
                alert('Please enter a query.');
                return;
            }

            try {
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query }),
                });

                const data = await response.json();

                if (response.ok) {
                    sqlQuery.textContent = data.sql_query;

                    resultsHead.innerHTML = `<tr>${data.columns.map(col => `<th class="p-2">${col}</th>`).join('')}</tr>`;
                    resultsBody.innerHTML = data.results.map(row => `<tr>${row.map(cell => `<td class="p-2">${cell}</td>`).join('')}</tr>`).join('');

                    resultsCard.classList.remove('hidden');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        });
    </script>
</body>
</html>
