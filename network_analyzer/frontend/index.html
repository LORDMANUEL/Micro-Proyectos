<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Analyzer OSINT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reusing the neumorphism styles */
        .neumorphism-container { background-color: #e0e5ec; }
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-input {
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-input:focus { outline: none; box-shadow: inset 7px 7px 14px #a3b1c6, inset -7px -7px 14px #ffffff; }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem 2rem;
            font-weight: 600;
            color: #333;
            box-shadow: 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-button:hover { box-shadow: 7px 7px 14px #a3b1c6, -7px -7px 14px #ffffff; }
        .neumorphism-button:active { box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff; }
        .result-box {
            background-color: #e0e5ec;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: inset 6px 6px 12px #a3b1c6, inset -6px -6px 12px #ffffff;
        }
    </style>
</head>
<body class="neumorphism-container min-h-screen flex items-center justify-center p-4">

    <div class="neumorphism-card w-full max-w-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Network Analyzer OSINT</h1>
        <form id="analyze-form">
            <div class="flex items-center gap-4">
                <input type="text" id="ip_address" name="ip_address" class="w-full neumorphism-input" placeholder="Enter IP Address (e.g., 8.8.8.8)" required>
                <button type="submit" id="submit-button" class="neumorphism-button">Analyze</button>
            </div>
        </form>

        <!-- Results Section -->
        <div id="results" class="mt-8 hidden">
            <div class="result-box">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Analysis Report for <span id="result-ip" class="font-bold"></span></h2>

                <!-- AI Summary -->
                <div class="mb-4">
                    <h3 class="font-bold text-lg text-gray-600">AI Summary</h3>
                    <p id="ai-summary" class="text-gray-800"></p>
                </div>

                <!-- Technical Data -->
                <div>
                    <h3 class="font-bold text-lg text-gray-600">Technical Data</h3>
                    <pre id="technical-data" class="text-sm bg-white bg-opacity-50 p-4 rounded-lg overflow-x-auto"></pre>
                </div>
            </div>
        </div>
        <div id="loading" class="mt-4 text-center hidden">
            <p class="text-gray-600">Analyzing... Please wait.</p>
        </div>
        <div id="error" class="mt-4 text-center text-red-500 hidden"></div>
    </div>

    <script>
        document.getElementById('analyze-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const ipAddress = document.getElementById('ip_address').value;
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.getElementById('loading');
            const errorDiv = document.getElementById('error');
            const submitButton = document.getElementById('submit-button');

            // Reset UI
            resultsDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            loadingDiv.classList.remove('hidden');
            submitButton.disabled = true;

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip_address: ipAddress })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'An unknown error occurred.');
                }

                const data = await response.json();

                // Populate results
                document.getElementById('result-ip').textContent = data.ip_address;
                document.getElementById('ai-summary').textContent = data.ai_summary;

                // Remove AI summary for clean technical data view
                const technicalData = { ...data };
                delete technicalData.ai_summary;
                document.getElementById('technical-data').textContent = JSON.stringify(technicalData, null, 2);

                resultsDiv.classList.remove('hidden');

            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.classList.remove('hidden');
            } finally {
                loadingDiv.classList.add('hidden');
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
