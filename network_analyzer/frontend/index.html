<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Network Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #e0e5ec; }
        .neumorphic {
            background-color: #e0e5ec;
            box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5);
        }
        .neumorphic-inset {
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
        }
        .neumorphic-btn:active {
            box-shadow: inset 1px 1px 2px #a3b1c6, inset -1px -1px 2px #ffffff;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="neumorphic w-full max-w-4xl p-8 rounded-2xl">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">OSINT Network Analyzer</h1>

        <div class="flex space-x-4 mb-8">
            <input type="text" id="ip-input" placeholder="Enter IP Address (e.g., 8.8.8.8)" class="flex-grow p-4 rounded-xl neumorphic-inset focus:outline-none">
            <button id="analyze-btn" class="neumorphic neumorphic-btn p-4 rounded-xl font-semibold text-gray-800">Analyze</button>
        </div>

        <div id="loader" class="hidden flex justify-center items-center my-4">
            <div class="loader"></div>
            <p class="ml-4 text-gray-600">Analyzing, please wait...</p>
        </div>

        <div id="results" class="hidden space-y-6">
            <!-- AI Summary -->
            <div>
                <h2 class="text-xl font-bold text-gray-600 mb-2">AI Summary</h2>
                <div id="ai-summary" class="p-4 rounded-lg neumorphic-inset text-gray-800"></div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <!-- Geolocation & ISP -->
                <div class="p-6 rounded-xl neumorphic">
                    <h3 class="text-lg font-semibold mb-3">Geolocation & ISP</h3>
                    <p><strong>IP Address:</strong> <span id="ip-address"></span></p>
                    <p><strong>Country:</strong> <span id="country"></span></p>
                    <p><strong>City:</strong> <span id="city"></span></p>
                    <p><strong>ISP:</strong> <span id="isp"></span></p>
                </div>

                <!-- WHOIS Info -->
                <div class="p-6 rounded-xl neumorphic">
                    <h3 class="text-lg font-semibold mb-3">WHOIS Information</h3>
                    <div id="whois-structured">
                        <p><strong>Organization:</strong> <span id="organization"></span></p>
                        <p><strong>Registrar:</strong> <span id="registrar"></span></p>
                    </div>
                    <div id="whois-raw" class="hidden mt-3">
                        <h4 class="font-semibold">Raw WHOIS Data:</h4>
                        <pre class="neumorphic-inset p-3 rounded-lg text-xs overflow-auto h-32"></pre>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('analyze-btn').addEventListener('click', async () => {
            const ipAddress = document.getElementById('ip-input').value;
            const resultsDiv = document.getElementById('results');
            const loader = document.getElementById('loader');

            if (!ipAddress) {
                alert('Please enter an IP address.');
                return;
            }

            resultsDiv.classList.add('hidden');
            loader.classList.remove('hidden');

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip_address: ipAddress })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to analyze IP.');
                }

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                loader.classList.add('hidden');
            }
        });

        function displayResults(data) {
            document.getElementById('results').classList.remove('hidden');

            document.getElementById('ai-summary').textContent = data.ai_summary || 'No summary available.';

            document.getElementById('ip-address').textContent = data.ip_address || 'N/A';
            document.getElementById('country').textContent = data.geolocation.country || 'N/A';
            document.getElementById('city').textContent = data.geolocation.city || 'N/A';
            document.getElementById('isp').textContent = data.isp.name || 'N/A';

            const whoisStructured = document.getElementById('whois-structured');
            const whoisRaw = document.getElementById('whois-raw');

            if (data.whois.raw_text) {
                whoisStructured.classList.add('hidden');
                whoisRaw.classList.remove('hidden');
                whoisRaw.querySelector('pre').textContent = data.whois.raw_text;
            } else if (data.whois.error) {
                 whoisStructured.classList.remove('hidden');
                 whoisRaw.classList.add('hidden');
                 document.getElementById('organization').textContent = data.whois.error;
                 document.getElementById('registrar').textContent = 'N/A';
            }
            else {
                whoisStructured.classList.remove('hidden');
                whoisRaw.classList.add('hidden');
                document.getElementById('organization').textContent = data.whois.organization || 'N/A';
                document.getElementById('registrar').textContent = data.whois.registrar || 'N/A';
            }
        }
    </script>
</body>
</html>
