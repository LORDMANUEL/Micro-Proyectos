<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Results</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: #f8f9fa; color: #212529; padding: 30px; }
        .container { max-width: 800px; margin: auto; background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08); }
        h1 { color: #28a745; margin-bottom: 20px; }
        pre { background-color: #e9ecef; color: #495057; padding: 20px; border-radius: 8px; border: 1px solid #dee2e6; white-space: pre-wrap; word-wrap: break-word; font-family: "Courier New", Courier, monospace; font-size: 14px; }
        a { display: inline-block; margin-top: 25px; background-color: #007bff; color: white; padding: 12px 20px; text-decoration: none; border-radius: 8px; transition: background-color 0.2s ease-in-out; }
        a:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Results for: {{ test_name }}</h1>
        <pre>{{ result }}</pre>
        <a href="{{ url_for('index') }}">Back to Tests</a>
    </div>
</body>
</html>
