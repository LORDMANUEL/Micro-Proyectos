<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Professional Email Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neumorphism-container { background-color: #e0e5ec; }
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-input, .neumorphism-select, .neumorphism-textarea {
            width: 100%;
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-input:focus, .neumorphism-select:focus, .neumorphism-textarea:focus { outline: none; box-shadow: inset 7px 7px 14px #a3b1c6, inset -7px -7px 14px #ffffff; }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem 2rem;
            font-weight: 600;
            color: #333;
            box-shadow: 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }
        .neumorphism-button:hover { box-shadow: 7px 7px 14px #a3b1c6, -7px -7px 14px #ffffff; }
        .neumorphism-button:active, .neumorphism-button:disabled {
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
            opacity: 0.7;
        }
        .result-box {
            background-color: #e0e5ec;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: inset 6px 6px 12px #a3b1c6, inset -6px -6px 12px #ffffff;
            white-space: pre-wrap;
            word-wrap: break-word;
            min-height: 150px;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="neumorphism-container min-h-screen flex items-center justify-center p-4">

    <div class="neumorphism-card w-full max-w-4xl">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-8">AI Professional Email Generator</h1>

        <form id="email-form" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Column 1 -->
            <div class="space-y-6">
                <div>
                    <label for="recipient" class="block text-gray-600 mb-2 font-semibold">Recipient</label>
                    <input type="text" id="recipient" class="neumorphism-input" placeholder="e.g., Project Manager" required>
                </div>
                <div>
                    <label for="objective" class="block text-gray-600 mb-2 font-semibold">Objective</label>
                    <input type="text" id="objective" class="neumorphism-input" placeholder="e.g., Request a project update meeting" required>
                </div>
                <div>
                    <label for="tone" class="block text-gray-600 mb-2 font-semibold">Tone</label>
                    <select id="tone" class="neumorphism-select">
                        <option>Formal</option>
                        <option selected>Friendly</option>
                        <option>Direct</option>
                        <option>Casual</option>
                    </select>
                </div>
            </div>

            <!-- Column 2 -->
            <div>
                <label for="key_points" class="block text-gray-600 mb-2 font-semibold">Key Points to Include (one per line)</label>
                <textarea id="key_points" rows="9" class="neumorphism-textarea" placeholder="e.g., Discuss Q3 budget results&#10;Define next steps for the 'Phoenix' project&#10;Confirm team availability" required></textarea>
            </div>

            <!-- Submit Button -->
            <div class="md:col-span-2 text-center mt-4">
                <button type="submit" id="submit-button" class="neumorphism-button">Generate Email</button>
            </div>
        </form>

        <!-- Loading Indicator -->
        <div id="loading" class="mt-8 justify-center items-center hidden">
            <div class="loader"></div>
            <p class="ml-4 text-gray-600">Generating email, please wait...</p>
        </div>

        <!-- Results Section -->
        <div id="results-container" class="mt-8 hidden">
            <h2 class="text-2xl font-semibold text-center text-gray-700 mb-4">Generated Email</h2>
            <div id="result-box" class="result-box relative">
                <p id="generated-email"></p>
                <button id="copy-button" class="absolute top-3 right-3 neumorphism-button text-sm py-2 px-3">Copy</button>
            </div>
        </div>

        <div id="error" class="mt-4 text-center text-red-500 hidden"></div>
    </div>

    <script>
        const form = document.getElementById('email-form');
        const submitButton = document.getElementById('submit-button');
        const resultsContainer = document.getElementById('results-container');
        const loadingDiv = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const generatedEmailP = document.getElementById('generated-email');
        const copyButton = document.getElementById('copy-button');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const formData = {
                recipient: document.getElementById('recipient').value,
                objective: document.getElementById('objective').value,
                tone: document.getElementById('tone').value,
                key_points: document.getElementById('key_points').value,
            };

            // UI feedback
            submitButton.disabled = true;
            submitButton.textContent = 'Generating...';
            loadingDiv.style.display = 'flex'; // Show loader
            resultsContainer.classList.add('hidden');
            errorDiv.classList.add('hidden');

            try {
                const response = await fetch('/api/generate_email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData),
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'An unknown error occurred');
                }

                const result = await response.json();
                generatedEmailP.textContent = result.email;
                resultsContainer.classList.remove('hidden');

            } catch (err) {
                errorDiv.textContent = `Error: ${err.message}`;
                errorDiv.classList.remove('hidden');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Generate Email';
                loadingDiv.style.display = 'none'; // Hide loader
            }
        });

        copyButton.addEventListener('click', () => {
            navigator.clipboard.writeText(generatedEmailP.textContent)
                .then(() => {
                    copyButton.textContent = 'Copied!';
                    setTimeout(() => { copyButton.textContent = 'Copy'; }, 2000);
                })
                .catch(err => alert('Failed to copy!'));
        });
    </script>
</body>
</html>
