<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-input {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            box-shadow: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
        }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            color: #333;
            box-shadow: 4px 4px 8px #a3b1c6, -4px -4px 8px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-button:hover {
            box-shadow: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
        }
    </style>
</head>
<body class="bg-[#e0e5ec] min-h-screen p-8">

    <div class="container mx-auto">
        <div class="neumorphism-card mb-8">
            <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Professional Email Generator</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="text" id="to-input" class="neumorphism-input" placeholder="To">
                <input type="text" id="subject-input" class="neumorphism-input" placeholder="Subject">
                <textarea id="prompt-input" class="neumorphism-input md:col-span-2" placeholder="Prompt"></textarea>
                <button id="generate-btn" class="neumorphism-button md:col-span-2 justify-self-center">Generate Email</button>
            </div>
        </div>

        <div id="email-card" class="neumorphism-card hidden">
            <h2 class="text-2xl font-bold text-center text-gray-700 mb-6">Generated Email</h2>
            <div class="bg-gray-200 p-4 rounded">
                <p id="email-output"></p>
            </div>
            <button id="copy-btn" class="neumorphism-button mt-4">Copy</button>
        </div>
    </div>

    <script>
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const to = document.getElementById('to-input').value;
            const subject = document.getElementById('subject-input').value;
            const promptText = document.getElementById('prompt-input').value;
            const emailCard = document.getElementById('email-card');
            const emailOutput = document.getElementById('email-output');

            const fullPrompt = `To: ${to}\nSubject: ${subject}\n\n${promptText}`;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: fullPrompt }),
                });

                const data = await response.json();

                if (response.ok) {
                    emailOutput.textContent = data.email;
                    emailCard.classList.remove('hidden');
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const emailText = document.getElementById('email-output').textContent;
            navigator.clipboard.writeText(emailText);
            alert('Email copied to clipboard!');
        });
    </script>
</body>
</html>
