<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create a New Ticket</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Neumorphism styles */
        .neumorphism-container {
            background-color: #e0e5ec;
        }
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-input {
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem;
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-input:focus {
            outline: none;
            box-shadow: inset 7px 7px 14px #a3b1c6, inset -7px -7px 14px #ffffff;
        }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 10px;
            padding: 1rem 2rem;
            font-weight: 600;
            color: #333;
            box-shadow: 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-button:hover {
            box-shadow: 7px 7px 14px #a3b1c6, -7px -7px 14px #ffffff;
        }
        .neumorphism-button:active {
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
        }
    </style>
</head>
<body class="neumorphism-container min-h-screen flex items-center justify-center">

    <div class="neumorphism-card w-full max-w-lg">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Submit a Support Ticket</h1>
        <form id="create-ticket-form">
            <div class="mb-4">
                <label for="user" class="block text-gray-600 mb-2">Created By</label>
                <select id="user" name="user" class="w-full neumorphism-input" required></select>
            </div>
            <div class="mb-4">
                <label for="title" class="block text-gray-600 mb-2">Title</label>
                <input type="text" id="title" name="title" class="w-full neumorphism-input" required>
            </div>
            <div class="mb-4">
                <label for="description" class="block text-gray-600 mb-2">Description</label>
                <textarea id="description" name="description" rows="4" class="w-full neumorphism-input" required></textarea>
            </div>
            <div class="mb-6">
                <label for="department" class="block text-gray-600 mb-2">Department</label>
                <select id="department" name="department" class="w-full neumorphism-input" required></select>
            </div>
            <button type="submit" class="w-full neumorphism-button">Create Ticket</button>
        </form>
        <div id="response-message" class="mt-4 text-center"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userSelect = document.getElementById('user');
            const departmentSelect = document.getElementById('department');
            const form = document.getElementById('create-ticket-form');
            const responseMessage = document.getElementById('response-message');

            // --- Fetch and populate users ---
            try {
                const usersResponse = await fetch('/api/users');
                const users = await usersResponse.json();
                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.id;
                    option.textContent = user.username;
                    userSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Failed to load users:', error);
                userSelect.innerHTML = '<option disabled>Could not load users</option>';
            }

            // --- Populate departments (static for now) ---
            const departments = [
                { id: 1, name: 'IT' },
                { id: 2, name: 'Human Resources' },
                { id: 3, name: 'Finance' }
            ];
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept.id;
                option.textContent = dept.name;
                departmentSelect.appendChild(option);
            });

            // --- Handle form submission ---
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                responseMessage.textContent = '';

                const formData = new FormData(form);
                const data = {
                    title: formData.get('title'),
                    description: formData.get('description'),
                    department_id: parseInt(formData.get('department')),
                    created_by_id: parseInt(formData.get('user')) // Now dynamic
                };

                try {
                    const response = await fetch('/api/tickets', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        responseMessage.textContent = `Ticket created successfully! Ticket ID: ${result.ticket_id}`;
                        responseMessage.style.color = 'green';
                        form.reset();
                    } else {
                        responseMessage.textContent = `Error: ${result.error}`;
                        responseMessage.style.color = 'red';
                    }
                } catch (error) {
                    responseMessage.textContent = 'An unexpected error occurred. Please try again.';
                    responseMessage.style.color = 'red';
                }
            });
        });
    </script>
</body>
</html>
