<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create IT Ticket</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neumorphism-container {
            background-color: #e0e5ec;
        }
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-input {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            box-shadow: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
        }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            color: #333;
            box-shadow: 4px 4px 8px #a3b1c6, -4px -4px 8px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-button:hover {
            box-shadow: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
        }
    </style>
</head>
<body class="neumorphism-container min-h-screen flex items-center justify-center">

    <div class="neumorphism-card w-full max-w-lg">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Submit a New Ticket</h1>
        <form id="create-ticket-form">
            <div class="mb-4">
                <label for="user-select" class="block text-gray-700 mb-2">Select User</label>
                <select id="user-select" class="neumorphism-input w-full" required>
                    <!-- Users will be loaded here -->
                </select>
            </div>
            <div class="mb-4">
                <label for="ticket-title" class="block text-gray-700 mb-2">Ticket Title</label>
                <input type="text" id="ticket-title" class="neumorphism-input w-full" required>
            </div>
            <div class="mb-4">
                <label for="ticket-description" class="block text-gray-700 mb-2">Description</label>
                <textarea id="ticket-description" class="neumorphism-input w-full" rows="4" required></textarea>
            </div>
            <button type="submit" class="neumorphism-button w-full">Submit Ticket</button>
        </form>
        <p id="form-status" class="text-center mt-4"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userSelect = document.getElementById('user-select');
            const form = document.getElementById('create-ticket-form');
            const formStatus = document.getElementById('form-status');

            async function fetchUsers() {
                try {
                    const response = await fetch('/api/users');
                    if (!response.ok) throw new Error('Failed to fetch users');
                    const users = await response.json();

                    userSelect.innerHTML = users.map(user => `<option value="${user.id}">${user.username}</option>`).join('');
                } catch (error) {
                    userSelect.innerHTML = `<option value="">${error.message}</option>`;
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                formStatus.textContent = 'Submitting...';

                const ticketData = {
                    title: document.getElementById('ticket-title').value,
                    description: document.getElementById('ticket-description').value,
                    created_by_id: userSelect.value,
                    department_id: 1 // Hardcoded to IT department for this example
                };

                try {
                    const response = await fetch('/api/tickets', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(ticketData)
                    });

                    if (response.ok) {
                        formStatus.textContent = 'Ticket submitted successfully!';
                        form.reset();
                    } else {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to submit ticket.');
                    }
                } catch (error) {
                    formStatus.textContent = `Error: ${error.message}`;
                }
            });

            fetchUsers();
        });
    </script>
</body>
</html>
