<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ticket Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Reusing the neumorphism styles from client.html */
        .neumorphism-container {
            background-color: #e0e5ec;
        }
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-table th, .neumorphism-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #c8d0e7;
        }
        .neumorphism-table th {
            color: #333;
            font-weight: 600;
        }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-weight: 500;
            color: #333;
            box-shadow: 4px 4px 8px #a3b1c6, -4px -4px 8px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-button:hover {
            box-shadow: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
        }
        .neumorphism-button:active {
            box-shadow: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
        }
    </style>
</head>
<body class="neumorphism-container min-h-screen p-8">

    <div class="neumorphism-card w-full max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Ticket Dashboard</h1>

        <div class="overflow-x-auto">
            <table class="w-full neumorphism-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Assigned To</th>
                        <th>Created By</th>
                        <th>Department</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ticket-queue">
                    <!-- Tickets will be loaded here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ticketQueue = document.getElementById('ticket-queue');

            async function fetchTickets() {
                try {
                    const response = await fetch('/api/tickets');
                    if (!response.ok) throw new Error('Failed to fetch tickets');
                    const tickets = await response.json();
                    renderTickets(tickets);
                } catch (error) {
                    ticketQueue.innerHTML = `<tr><td colspan="8" class="text-center text-red-500">${error.message}</td></tr>`;
                }
            }

            function renderTickets(tickets) {
                if (tickets.length === 0) {
                    ticketQueue.innerHTML = `<tr><td colspan="8" class="text-center text-gray-500">No tickets in the queue.</td></tr>`;
                    return;
                }

                ticketQueue.innerHTML = tickets.map(ticket => `
                    <tr>
                        <td>${ticket.id}</td>
                        <td>${ticket.title}</td>
                        <td>${ticket.category}</td>
                        <td><span class="px-2 py-1 font-semibold leading-tight rounded-sm ${ticket.status === 'Closed' ? 'text-red-700 bg-red-100' : 'text-green-700 bg-green-100'}">${ticket.status}</span></td>
                        <td class="assigned-to">${ticket.assigned_to || 'Unassigned'}</td>
                        <td>${ticket.created_by}</td>
                        <td>${ticket.department}</td>
                        <td data-ticket-id="${ticket.id}">
                            <button class="neumorphism-button assign-btn mr-2" ${ticket.assigned_to || ticket.status === 'Closed' ? 'disabled' : ''}>Assign</button>
                            <button class="neumorphism-button close-btn" ${ticket.status === 'Closed' ? 'disabled' : ''}>Close</button>
                        </td>
                    </tr>
                `).join('');
            }

            async function assignTicket(ticketId) {
                try {
                    const response = await fetch(`/api/tickets/${ticketId}/assign`, { method: 'PUT' });
                    if (!response.ok) throw new Error('Failed to assign the ticket.');
                    const data = await response.json();

                    // Visually update the row
                    const row = document.querySelector(`td[data-ticket-id='${ticketId}']`).parentNode;
                    row.querySelector('.assigned-to').textContent = data.assigned_to;
                    row.querySelector('.assign-btn').disabled = true;
                } catch (error) {
                    alert(error.message);
                }
            }

            async function closeTicket(ticketId) {
                try {
                    const response = await fetch(`/api/tickets/${ticketId}/close`, { method: 'PUT' });
                    if (!response.ok) throw new Error('Failed to close the ticket.');

                    const row = document.querySelector(`td[data-ticket-id='${ticketId}']`).parentNode;
                    const statusSpan = row.querySelector('span');
                    statusSpan.textContent = 'Closed';
                    statusSpan.classList.remove('text-green-700', 'bg-green-100');
                    statusSpan.classList.add('text-red-700', 'bg-red-100');
                    row.querySelectorAll('button').forEach(btn => btn.disabled = true);
                } catch (error) {
                    alert(error.message);
                }
            }

            ticketQueue.addEventListener('click', (event) => {
                const target = event.target;
                const ticketId = target.closest('td').dataset.ticketId;

                if (target.classList.contains('close-btn')) {
                    if (confirm(`Are you sure you want to close ticket #${ticketId}?`)) {
                        closeTicket(ticketId);
                    }
                } else if (target.classList.contains('assign-btn')) {
                    assignTicket(ticketId);
                }
            });

            fetchTickets();
        });
    </script>
</body>
</html>
