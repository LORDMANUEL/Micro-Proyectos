<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Ticket Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neumorphism-container {
            background-color: #e0e5ec;
        }
        .neumorphism-card {
            background-color: #e0e5ec;
            border-radius: 20px;
            box-shadow: 9px 9px 16px #a3b1c6, -9px -9px 16px #ffffff;
            padding: 2rem;
        }
        .neumorphism-table th, .neumorphism-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #c8d0e7;
        }
        .neumorphism-table th {
            color: #333;
            font-weight: 600;
        }
        .neumorphism-button {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-weight: 500;
            color: #333;
            box-shadow: 4px 4px 8px #a3b1c6, -4px -4px 8px #ffffff;
            transition: all 0.2s ease-in-out;
        }
        .neumorphism-button:hover {
            box-shadow: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
        }
        .neumorphism-button:active, .neumorphism-button:disabled {
            box-shadow: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
            opacity: 0.6;
        }
        .neumorphism-select {
            background-color: #e0e5ec;
            border: none;
            border-radius: 8px;
            padding: 0.5rem;
            box-shadow: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
        }
    </style>
</head>
<body class="neumorphism-container min-h-screen p-8">

    <div class="neumorphism-card w-full max-w-7xl mx-auto">
        <h1 class="text-3xl font-bold text-center text-gray-700 mb-6">Ticket Dashboard</h1>

        <div class="overflow-x-auto">
            <table class="w-full neumorphism-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Assigned To</th>
                        <th>Created By</th>
                        <th>Department</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="ticket-queue">
                    <!-- Tickets will be loaded here dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const ticketQueue = document.getElementById('ticket-queue');
            let admins = [];

            async function fetchAdmins() {
                try {
                    const response = await fetch('/api/admins');
                    if (!response.ok) throw new Error('Failed to fetch admins');
                    admins = await response.json();
                } catch (error) {
                    console.error(error.message);
                }
            }

            async function fetchTickets() {
                try {
                    const response = await fetch('/api/tickets');
                    if (!response.ok) throw new Error('Failed to fetch tickets');
                    const tickets = await response.json();
                    renderTickets(tickets);
                } catch (error) {
                    ticketQueue.innerHTML = `<tr><td colspan="8" class="text-center text-red-500">${error.message}</td></tr>`;
                }
            }

            function renderTickets(tickets) {
                if (tickets.length === 0) {
                    ticketQueue.innerHTML = `<tr><td colspan="8" class="text-center text-gray-500">No tickets in the queue.</td></tr>`;
                    return;
                }

                const adminOptions = admins.map(admin => `<option value="${admin.id}">${admin.username}</option>`).join('');

                ticketQueue.innerHTML = tickets.map(ticket => `
                    <tr data-ticket-id="${ticket.id}">
                        <td>${ticket.id}</td>
                        <td>${ticket.title}</td>
                        <td>${ticket.category || 'Pending...'}</td>
                        <td><span class="status-span px-2 py-1 font-semibold leading-tight rounded-sm ${ticket.status === 'Closed' ? 'text-red-700 bg-red-100' : 'text-green-700 bg-green-100'}">${ticket.status}</span></td>
                        <td class="assigned-to">${ticket.assigned_to || 'Unassigned'}</td>
                        <td>${ticket.created_by}</td>
                        <td>${ticket.department}</td>
                        <td class="space-y-2">
                            <div class="flex items-center space-x-2">
                                <select class="assign-select neumorphism-select w-full" ${ticket.status === 'Closed' ? 'disabled' : ''}>
                                    <option value="">Assign to...</option>
                                    ${adminOptions}
                                </select>
                                <button class="neumorphism-button assign-btn" ${ticket.status === 'Closed' ? 'disabled' : ''}>Assign</button>
                            </div>
                            <button class="neumorphism-button close-btn w-full" ${ticket.status === 'Closed' ? 'disabled' : ''}>Close</button>
                        </td>
                    </tr>
                `).join('');
            }

            async function assignTicket(ticketId, assigneeId) {
                if (!assigneeId) {
                    alert('Please select an admin to assign the ticket.');
                    return;
                }

                try {
                    const response = await fetch(`/api/tickets/${ticketId}/assign`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ assignee_id: assigneeId })
                    });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || 'Failed to assign the ticket.');
                    }
                    const data = await response.json();

                    const row = document.querySelector(`tr[data-ticket-id='${ticketId}']`);
                    row.querySelector('.assigned-to').textContent = data.assigned_to;
                } catch (error) {
                    alert(error.message);
                }
            }

            async function closeTicket(ticketId) {
                try {
                    const response = await fetch(`/api/tickets/${ticketId}/close`, { method: 'PUT' });
                    if (!response.ok) throw new Error('Failed to close the ticket.');

                    const row = document.querySelector(`tr[data-ticket-id='${ticketId}']`);
                    const statusSpan = row.querySelector('.status-span');
                    statusSpan.textContent = 'Closed';
                    statusSpan.classList.remove('text-green-700', 'bg-green-100');
                    statusSpan.classList.add('text-red-700', 'bg-red-100');
                    row.querySelectorAll('button, select').forEach(el => el.disabled = true);
                } catch (error) {
                    alert(error.message);
                }
            }

            ticketQueue.addEventListener('click', (event) => {
                const target = event.target;
                const row = target.closest('tr');
                if (!row) return;

                const ticketId = row.dataset.ticketId;

                if (target.classList.contains('close-btn')) {
                    if (confirm(`Are you sure you want to close ticket #${ticketId}?`)) {
                        closeTicket(ticketId);
                    }
                } else if (target.classList.contains('assign-btn')) {
                    const select = row.querySelector('.assign-select');
                    assignTicket(ticketId, select.value);
                }
            });

            async function initialize() {
                await fetchAdmins();
                await fetchTickets();
            }

            initialize();
        });
    </script>
</body>
</html>
