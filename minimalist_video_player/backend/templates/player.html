<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing: {{ playlist.name }}</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            color: white;
            font-family: Arial, sans-serif;
        }
        .slide {
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .slide.active {
            display: flex;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .colors {
            background-color: #c0392b; /* Red */
        }
        .colors.blue {
            background-color: #2980b9; /* Blue */
        }
        .colors.white {
            background-color: #ecf0f1; /* White */
        }
    </style>
</head>
<body>
    {% for item in items %}
    <div class="slide" data-duration="{{ 10000 if item.file_type in ['html', 'png', 'jpg', 'jpeg', 'gif'] else 0 }}">
        {% if item.file_type in ['mp4', 'webm'] %}
            <video src="/uploads/{{ item.filename }}" autoplay muted onended="nextSlide()"></video>
        {% elif item.file_type == 'html' %}
            <iframe src="/uploads/{{ item.filename }}"></iframe>
        {% else %}
            <div class="w-full h-full flex items-center justify-center">
                <img src="/uploads/{{ item.filename }}" class="max-w-full max-h-full">
            </div>
        {% endif %}
    </div>
    {% endfor %}

    <script>
        const slides = document.querySelectorAll('.slide');
        const colors = ['#c0392b', '#2980b9', '#ecf0f1'];
        let currentSlide = 0;
        let colorIndex = 0;

        function showSlide(index) {
            slides.forEach((slide, i) => {
                slide.classList.remove('active');
                if (i === index) {
                    slide.classList.add('active');
                    document.body.style.backgroundColor = colors[colorIndex];
                    colorIndex = (colorIndex + 1) % colors.length;
                }
            });

            const activeSlide = slides[index];
            const duration = parseInt(activeSlide.dataset.duration, 10);

            if (duration > 0) { // It's an HTML page or image
                setTimeout(nextSlide, duration);
            }
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % slides.length;
            showSlide(currentSlide);
        }

        if (slides.length > 0) {
            showSlide(0);
        }
    </script>
</body>
</html>
