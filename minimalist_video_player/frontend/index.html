<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Video Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold text-center mb-8">Minimalist Video Player</h1>

        <div class="bg-white p-8 rounded-lg shadow-lg mb-8">
            <h2 class="text-xl font-bold mb-4">Upload Media</h2>
            <input type="file" id="file-upload" class="border p-2 w-full">
            <button id="upload-btn" class="bg-blue-500 text-white px-4 py-2 rounded mt-4">Upload</button>
        </div>

        <div class="bg-white p-8 rounded-lg shadow-lg">
            <h2 class="text-xl font-bold mb-4">Playlist</h2>
            <div id="playlist" class="space-y-2"></div>
            <button id="play-btn" class="bg-green-500 text-white px-4 py-2 rounded mt-4">Play</button>
        </div>
    </div>

    <div id="player" class="fixed inset-0 bg-black hidden">
        <video id="video-player" class="w-full h-full" controls></video>
        <img id="image-player" class="w-full h-full object-contain" />
        <iframe id="html-player" class="w-full h-full"></iframe>
        <button id="close-player-btn" class="absolute top-4 right-4 text-white text-2xl">&times;</button>
    </div>

    <script>
        const uploadBtn = document.getElementById('upload-btn');
        const fileUpload = document.getElementById('file-upload');
        const playlistDiv = document.getElementById('playlist');
        const playBtn = document.getElementById('play-btn');
        const playerDiv = document.getElementById('player');
        const videoPlayer = document.getElementById('video-player');
        const imagePlayer = document.getElementById('image-player');
        const htmlPlayer = document.getElementById('html-player');
        const closePlayerBtn = document.getElementById('close-player-btn');

        let playlist = [];
        let currentTrack = 0;

        uploadBtn.addEventListener('click', async () => {
            const file = fileUpload.files[0];
            if (!file) {
                alert('Please select a file to upload.');
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData,
                });
                const data = await response.json();
                if (response.ok) {
                    playlist.push(data.filename);
                    renderPlaylist();
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        });

        function renderPlaylist() {
            playlistDiv.innerHTML = playlist.map((filename, index) => `
                <div class="flex justify-between items-center p-2 rounded ${index === currentTrack ? 'bg-gray-200' : ''}">
                    <span>${filename}</span>
                </div>
            `).join('');
        }

        playBtn.addEventListener('click', () => {
            if (playlist.length > 0) {
                playerDiv.classList.remove('hidden');
                playTrack(currentTrack);
            }
        });

        closePlayerBtn.addEventListener('click', () => {
            playerDiv.classList.add('hidden');
            videoPlayer.pause();
        });

        function playTrack(index) {
            const filename = playlist[index];
            const extension = filename.split('.').pop().toLowerCase();

            videoPlayer.classList.add('hidden');
            imagePlayer.classList.add('hidden');
            htmlPlayer.classList.add('hidden');

            if (['mp4', 'webm'].includes(extension)) {
                videoPlayer.classList.remove('hidden');
                videoPlayer.src = `/uploads/${filename}`;
                videoPlayer.play();
                videoPlayer.onended = () => playNext();
            } else if (['jpg', 'jpeg', 'png', 'gif'].includes(extension)) {
                imagePlayer.classList.remove('hidden');
                imagePlayer.src = `/uploads/${filename}`;
                setTimeout(playNext, 5000); // Show image for 5 seconds
            } else if (['html'].includes(extension)) {
                htmlPlayer.classList.remove('hidden');
                htmlPlayer.src = `/uploads/${filename}`;
                setTimeout(playNext, 10000); // Show HTML for 10 seconds
            }
        }

        function playNext() {
            currentTrack = (currentTrack + 1) % playlist.length;
            playTrack(currentTrack);
            renderPlaylist();
        }
    </script>
</body>
</html>
